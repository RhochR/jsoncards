<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="src/style.css" type="text/css">
  <title>jsoncards</title>
</head>
<body>
  <div id="app">
    <div id="card">
      <p class="card-text">CARD Text goes here! Long text for Multiline tests.</p>
    </div>

    <div id="buttons-container">
      <button id="button-wrong" class="buttons">
        <span class="button-text">Wrong</span>
      </button>

      <button id="button-right" class="buttons">
        <span class="button-text">Right</span>
      </button>
    </div>

    <div id="boxes">
      <div class="box">
        <div class="small-cards-container">
          <div class="flashcard-mini"></div>
          <div class="flashcard-mini"></div>
          <div class="flashcard-mini"></div>
          <div class="flashcard-mini"></div>
          <div class="flashcard-mini"></div>
          <div class="flashcard-mini"></div>
          <div class="flashcard-mini"></div>
          <div class="flashcard-mini"></div>
        </div>
        <div class="box-label-container">
          <span class="box-label-text">Everyday</span>
        </div>
      </div>

      <div class="box">
        <div class="small-cards-container">
          <div class="flashcard-mini"></div>
          <div class="flashcard-mini"></div>
          <div class="flashcard-mini"></div>
          <div class="flashcard-mini"></div>
        </div>
        <div class="box-label-container">
          <span class="box-label-text">Every 2 Days</span>
        </div>
      </div>

      <div class="box">
        <div class="small-cards-container">
          <div class="flashcard-mini"></div>
          <div class="flashcard-mini"></div>
          <div class="flashcard-mini"></div>
          <div class="flashcard-mini"></div>
          <div class="flashcard-mini"></div>
          <div class="flashcard-mini"></div>
        </div>
        <div class="box-label-container">
          <span class="box-label-text">Every 5 Days</span>
        </div>
      </div>
      
      <div class="box">
        <div class="small-cards-container">
          <div class="flashcard-mini"></div>
          <div class="flashcard-mini"></div>
          <div class="flashcard-mini"></div>
        </div>
        <div class="box-label-container">
          <span class="box-label-text">Weekly</span>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
